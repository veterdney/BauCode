<title>Structure Scoring Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: sticky control rail on top, one analysis view below; drill-down is the working surface */
:root{
  --bg:#f3f4f2;--panel:#ffffff;--ink:#1b2024;--mute:#5d676e;--line:#d7dbd8;--soft:#e8ebe8;
  --accent:#c2410c;--good:#2f7d4f;--warn:#b7791f;--bad:#b3261e;
  --a1:#6b7a8f;--a2:#3e6fb0;--a3:#a8573a;--a4:#2a8c82;--a5:#b58a2c;--a6:#6f9a3d;
  --c1:#4f6d8f;--c2:#4c8b6a;--c3:#a05b86;--c4:#c0872f;--c5:#6b6fb0;
  --heat0:#e9c7bd;--heat1:#f1ecd9;--heat2:#bcd9c7;
  --f-d:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;--f-b:"IBM Plex Sans",system-ui,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181b;--panel:#1d2327;--ink:#e7eaec;--mute:#9aa5ab;--line:#2f383d;--soft:#262e33;
  --accent:#f08a4b;--good:#5fbf86;--warn:#e0b04f;--bad:#f0746c;
  --a1:#93a3b8;--a2:#6f9be0;--a3:#d98a6d;--a4:#4fc0b4;--a5:#e0b95a;--a6:#9bc965;
  --c1:#7f9fc4;--c2:#74c39a;--c3:#cf8cb8;--c4:#e2b160;--c5:#9a9fe0;
  --heat0:#5a3a33;--heat1:#4a4838;--heat2:#35553f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b;--panel:#1d2327;--ink:#e7eaec;--mute:#9aa5ab;--line:#2f383d;--soft:#262e33;
  --accent:#f08a4b;--good:#5fbf86;--warn:#e0b04f;--bad:#f0746c;
  --a1:#93a3b8;--a2:#6f9be0;--a3:#d98a6d;--a4:#4fc0b4;--a5:#e0b95a;--a6:#9bc965;
  --c1:#7f9fc4;--c2:#74c39a;--c3:#cf8cb8;--c4:#e2b160;--c5:#9a9fe0;
  --heat0:#5a3a33;--heat1:#4a4838;--heat2:#35553f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-b);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(24px,4vw,34px);font-weight:700}
h2{font-size:20px;font-weight:700;margin-bottom:6px}
h3{font-size:15px;font-weight:700}
.sub{color:var(--mute);max-width:70ch;margin:6px 0 0}
header{padding:20px 0 12px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav button{font:500 13px var(--f-b);color:var(--mute);background:none;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);background:var(--soft);box-shadow:inset 0 -2px 0 var(--accent)}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{margin-left:auto}
main{padding:18px 0 48px;display:grid;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.ctl{display:grid;gap:10px}
.ctl label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:500 12px var(--f-b);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn[aria-pressed="true"],.btn:hover{border-color:var(--accent)}
.rank{display:grid;gap:10px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel)}
.row:hover{border-color:var(--accent)}
.row .n{font:700 20px var(--f-d);color:var(--mute);text-align:center}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .sc{font:600 20px var(--f-m);text-align:right}
.delta{font:500 11px var(--f-m);color:var(--mute)}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--soft);margin-top:6px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11px var(--f-b);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
td.num,th.num{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.heat td.cell{text-align:center;font-family:var(--f-m);cursor:pointer;min-width:84px}
.heat td.cell:hover{outline:2px solid var(--accent)}
.heat td.best{font-weight:700;box-shadow:inset 0 0 0 2px var(--ink)}
.pill{display:inline-block;font:600 11px var(--f-m);padding:2px 7px;border-radius:99px;border:1px solid currentColor}
.good{color:var(--good)}.caution{color:var(--warn)}.critical{color:var(--bad)}
.sel{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.sel label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
select{font:14px var(--f-b);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.build{display:flex;gap:2px;align-items:stretch;min-height:92px}
.build>div{border-radius:4px;padding:6px 5px;color:#10161a;font-size:11px;font-weight:600;overflow:hidden;min-width:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:2px solid transparent}
.build>div.on{border-color:var(--ink)}
.build small{font:400 10px var(--f-m);display:block}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:4px 0 0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:4px;align-items:center}
.bar b{display:block;height:7px;border-radius:2px;background:var(--c1)}
.bar span{font:11px var(--f-m);text-align:right}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kv small{display:block;color:var(--mute);font-size:11px}
.kv strong{font:600 17px var(--f-m)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;background:var(--panel);text-align:left;color:var(--ink)}
.chip.on{border-color:var(--ink)}
.detail{margin-top:10px;font-size:13px;border-left:3px solid var(--accent);padding:6px 12px;background:var(--soft);border-radius:0 6px 6px 0}
.note{color:var(--mute);font-size:12px}
.mc{display:grid;gap:6px}
.mc .b{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px}
.mc .b i{display:block;height:12px;border-radius:2px}
svg text{font-family:var(--f-b);fill:var(--ink)}
.chart text.mute{fill:var(--mute)}
.ch-t{font:600 13px var(--f-d)}
@media(prefers-reduced-motion:no-preference){.stack i,.bar b,.mc i{transition:width .25s}}
</style>
<div class="wrap">
<header>
  <h1>Structure Scoring Lab</h1>
  <p class="sub">Six structural systems for a 500 m² residential building in Germany, 50-year study period. Scored at three levels: layer, building part, whole building. Facts come from Ökobaudat 2024-II; durability, cost, sound, fire and moisture inputs are marked as assumptions.</p>
</header>
<nav id="nav" role="tablist"></nav>
<div id="ctl" style="margin-top:14px"></div>
<main id="view"></main>
</div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const AL=D.alts, PN=Object.fromEntries(D.parts), PK=D.parts.map(x=>x[0]);
const CN={D:'Durability',E:'Environment',W:'Well-being',C:'Cost',K:'Compatibility'}, CK=['D','E','W','C','K'];
const CCOL={D:'var(--c1)',E:'var(--c2)',W:'var(--c3)',C:'var(--c4)',K:'var(--c5)'};
const ACOL=i=>`var(--a${i})`;
const S={w:{D:1,E:1,W:1,C:1,K:1},vol:true,alt:6,part:'OW',layer:0,view:'overview',ifx:null};
try{const h=location.hash.slice(1);if(h)S.view=h}catch(e){}
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const f1=x=>x.toFixed(1);
const wsum=()=>CK.reduce((s,k)=>s+S.w[k],0)||1;
const pScore=(a,p)=>{const P=AL[a-1].parts[p];return CK.reduce((s,k)=>s+S.w[k]/wsum()*P.crit[k],0)};
const pW=(a,p)=>S.vol?AL[a-1].parts[p].w:1/PK.length;
const alt=(a,w)=>{const o={tot:0,pts:{D:0,E:0,W:0,C:0,K:0}};for(const p of PK){const P=AL[a-1].parts[p];for(const k of CK){const c=pW(a,p)*(w||S.w)[k]/CK.reduce((s,x)=>s+(w||S.w)[x],0)*P.crit[k];o.pts[k]+=c;o.tot+=c}}return o};
const base={D:1,E:1,W:1,C:1,K:1};
const ranks=(w,vol)=>{const v=S.vol;S.vol=vol;const r=AL.map(x=>[x.id,alt(x.id,w).tot]).sort((a,b)=>b[1]-a[1]);S.vol=v;return Object.fromEntries(r.map((x,i)=>[x[0],i+1]))};
const heat=v=>{ // 30 = poor, 80 = good, relative to the observed range
  const t=Math.max(0,Math.min(1,(v-45)/(75-45)));return t<.5?`color-mix(in srgb,var(--heat0) ${100-t*200}%,var(--heat1))`:`color-mix(in srgb,var(--heat1) ${100-(t-.5)*200}%,var(--heat2))`};
const TABS=[['overview','Ranking'],['parts','Building parts'],['drill','Layers & compatibility'],['walls','Inner vs outer wall'],['carbon','Carbon & cost'],['sens','Sensitivity'],['assume','Assumptions']];
function nav(){const n=document.getElementById('nav');n.innerHTML='';
  TABS.forEach(([id,l])=>{const b=$(`<button role="tab" aria-selected="${S.view===id}">${l}</button>`);b.onclick=()=>go(id);n.appendChild(b)});
  const t=$(`<button class="theme" title="Toggle light/dark">◐ Theme</button>`);t.onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'};n.appendChild(t)}
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render()}
function sliders(){
  const p=$(`<div class="panel ctl"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><h3>Weights: what matters most?</h3><div class="presets" id="pre"></div></div><div id="sl" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px"></div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="note">Building parts count</span><div class="presets"><button class="btn" id="bv" aria-pressed="${S.vol}">by material volume</button><button class="btn" id="be" aria-pressed="${!S.vol}">equally</button></div><span class="note">Criterion weights apply at Level 2 (part scores) and to layer means; part weights apply at Level 3.</span></div></div>`);
  const pre=p.querySelector('#pre');
  [['Equal',{D:1,E:1,W:1,C:1,K:1}],['Carbon first',{D:1,E:4,W:1,C:1,K:1}],['Well-being first',{D:1,E:1,W:4,C:1,K:1}],['Cost first',{D:1,E:1,W:1,C:4,K:1}],['Durability first',{D:4,E:1,W:1,C:1,K:1}]].forEach(([n,w])=>{const b=$(`<button class="btn" aria-pressed="${JSON.stringify(w)===JSON.stringify(S.w)}">${n}</button>`);b.onclick=()=>{S.w={...w};render()};pre.appendChild(b)});
  const sl=p.querySelector('#sl');
  CK.forEach(k=>{const l=$(`<label for="w${k}"><span><i class="sw" style="background:${CCOL[k]}"></i>${CN[k]}</span><span class="mono" data-k="${k}">${(100*S.w[k]/wsum()).toFixed(0)} %</span><input id="w${k}" type="range" min="0" max="8" step="0.5" value="${S.w[k]}"></label>`);
    l.querySelector('input').oninput=e=>{S.w[k]=+e.target.value;p.querySelectorAll('[data-k]').forEach(x=>x.textContent=(100*S.w[x.dataset.k]/wsum()).toFixed(0)+' %');p.querySelectorAll('.presets:first-of-type .btn').forEach(x=>x.setAttribute('aria-pressed','false'));renderMain()};sl.appendChild(l)});
  p.querySelector('#bv').onclick=()=>{S.vol=true;render()};p.querySelector('#be').onclick=()=>{S.vol=false;render()};
  return p}
function legend(){return `<div class="legend">${CK.map(k=>`<span><i class="sw" style="background:${CCOL[k]}"></i>${CN[k]}</span>`).join('')}</div>`}
/* ---------- views ---------- */
function vOverview(m){
  const base_r=ranks(base,true),cur=AL.map(a=>({a,r:alt(a.id)})).sort((x,y)=>y.r.tot-x.r.tot);
  const box=$(`<div><div class="panel"><h2>Whole-building score</h2><p class="sub" style="margin:0 0 10px">Level 3: each building part's score, weighted by its share of material volume. Bars show the points each criterion contributes. Click an alternative to open its parts.</p>${legend()}<div class="rank" id="rk" style="margin-top:12px"></div></div></div>`);
  const rk=box.querySelector('#rk');
  cur.forEach((x,i)=>{const d=base_r[x.a.id]-(i+1);const row=$(`<div class="row" tabindex="0" role="button"><div class="n">${i+1}</div><div><div class="nm"><i class="sw" style="background:${ACOL(x.a.id)}"></i>${x.a.id}. ${x.a.name}</div><div class="stack">${CK.map(k=>`<i style="width:${x.r.pts[k]}%;background:${CCOL[k]}" title="${CN[k]} ${f1(x.r.pts[k])}"></i>`).join('')}</div><div class="delta">${CK.map(k=>f1(x.r.pts[k])).join(' · ')}${d?`  ·  ${d>0?'▲':'▼'}${Math.abs(d)} vs default weights`:''}</div></div><div class="sc">${f1(x.r.tot)}</div></div>`);
    row.onclick=()=>{S.alt=x.a.id;go('parts')};row.onkeydown=e=>{if(e.key==='Enter')row.onclick()};rk.appendChild(row)});
  m.appendChild(box);
  const v=$(`<div class="panel"><h3>Share of building volume per part</h3><p class="note">These shares weight Level 3. Heavy parts (ground slab, outer wall, floors, roof) dominate; windows are about 1 %.</p><div class="scroll"><table><thead><tr><th>Alternative</th>${PK.map(p=>`<th class="num">${PN[p]}</th>`).join('')}</tr></thead><tbody>${AL.map(a=>`<tr><td>${a.id}. ${a.short}</td>${PK.map(p=>`<td class="num">${(100*a.parts[p].w).toFixed(0)} %</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`);
  m.appendChild(v)}
function vParts(m){
  const t=$(`<div class="panel"><h2>Level 2: building-part scores</h2><p class="sub" style="margin:0 0 10px">0–100, 100 = best, using your criterion weights. Outlined cell = best alternative for that part. Click a cell to inspect its layers.</p><div class="scroll"><table class="heat"><thead><tr><th>Part</th>${AL.map(a=>`<th class="num" style="color:${ACOL(a.id)}">${a.id}. ${a.short}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div></div>`);
  const tb=t.querySelector('#tb');
  PK.forEach(p=>{const v=AL.map(a=>pScore(a.id,p)),mx=Math.max(...v);
    tb.appendChild($(`<tr><td>${PN[p]}</td>${v.map((x,i)=>`<td class="cell ${x===mx?'best':''}" data-a="${i+1}" data-p="${p}" style="background:${heat(x)}">${f1(x)}</td>`).join('')}</tr>`))});
  tb.querySelectorAll('td.cell').forEach(c=>c.onclick=()=>{S.alt=+c.dataset.a;S.part=c.dataset.p;S.layer=0;S.ifx=null;go('drill')});
  const tot=$(`<tr><td><strong>Whole building</strong></td>${AL.map(a=>`<td class="num"><strong>${f1(alt(a.id).tot)}</strong></td>`).join('')}</tr>`);tb.appendChild(tot);
  m.appendChild(t);
  const c=$(`<div class="panel"><h3>Criterion points per part, selected alternative</h3><div class="sel"><label>Alternative<select id="sa">${AL.map(a=>`<option value="${a.id}" ${a.id===S.alt?'selected':''}>${a.id}. ${a.name}</option>`).join('')}</select></label></div><div class="scroll"><table style="margin-top:10px"><thead><tr><th>Part</th>${CK.map(k=>`<th class="num"><i class="sw" style="background:${CCOL[k]}"></i>${CN[k]}</th>`).join('')}<th class="num">Score</th></tr></thead><tbody>${PK.map(p=>{const P=AL[S.alt-1].parts[p];return `<tr><td>${PN[p]}</td>${CK.map(k=>`<td class="num" style="background:${heat(P.crit[k])}">${P.crit[k].toFixed(0)}</td>`).join('')}<td class="num"><strong>${f1(pScore(S.alt,p))}</strong></td></tr>`}).join('')}</tbody></table></div><p class="note">Cells are 0–100 criterion scores before weighting.</p></div>`);
  c.querySelector('#sa').onchange=e=>{S.alt=+e.target.value;renderMain()};m.appendChild(c)}
const L1w=l=>{const w=[S.w.D,S.w.E,S.w.W,S.w.C],s=w.reduce((a,b)=>a+b,0)||1;return l.sc.reduce((a,x,i)=>a+x*w[i]/s,0)};
function vDrill(m){
  const a=AL[S.alt-1],P=a.parts[S.part];
  const top=$(`<div class="panel"><h2>Level 1 and 2: layers and compatibility</h2><div class="sel"><label>Alternative<select id="sa">${AL.map(x=>`<option value="${x.id}" ${x.id===S.alt?'selected':''}>${x.id}. ${x.name}</option>`).join('')}</select></label><label>Building part<select id="sp">${PK.map(p=>`<option value="${p}" ${p===S.part?'selected':''}>${PN[p]}</option>`).join('')}</select></label></div></div>`);
  top.querySelector('#sa').onchange=e=>{S.alt=+e.target.value;S.layer=0;S.ifx=null;renderMain()};top.querySelector('#sp').onchange=e=>{S.part=e.target.value;S.layer=0;S.ifx=null;renderMain()};
  m.appendChild(top);
  const kv=$(`<div class="kv"><div><small>Part score</small><strong>${f1(pScore(S.alt,S.part))}</strong></div><div><small>Volume share of building</small><strong>${(100*P.w).toFixed(1)} %</strong></div>${P.U?`<div><small>U-value (target ${P.Ut})</small><strong>${P.U} W/m²K</strong></div>`:''}${P.rw?`<div><small>Est. sound Rw</small><strong>${P.rw} dB</strong></div>`:''}<div><small>Whole build-up</small><strong class="${P.whole}">${P.whole}</strong></div></div>`);
  const bp=$(`<div class="panel"><h3>Build-up, inside to outside (floors and ground slab: top to bottom)</h3><p class="note">Width is proportional to thickness; colour shows the layer's mean score (green high, red low). Click a layer.</p><div class="build" id="bd"></div><div class="ends"><span>room side / top</span><span>weather side / bottom</span></div></div>`);
  bp.insertBefore(kv,bp.firstChild);kv.style.marginBottom='14px';
  const bd=bp.querySelector('#bd');
  P.layers.forEach((l,i)=>{const w=Math.max(l.vs,.012)*100,sc=L1w(l);const d=$(`<div class="${i===S.layer?'on':''}" style="flex:${w} 1 0;background:${heat(sc/1+0)}" title="${l.m}"><span>${l.m}<small>${l.t?l.t+' mm'+(l.fr<1?' ×'+l.fr:''):'area prod.'}</small></span><small>${sc.toFixed(0)}</small></div>`);d.onclick=()=>{S.layer=i;renderMain()};bd.appendChild(d)});
  m.appendChild(bp);
  const L=P.layers[S.layer]||P.layers[0];
  const tl=$(`<div class="panel"><h3>Layer scores (Level 1)</h3><p class="note">0–100 within layers that do the same job across all alternatives. Weighted by your sliders.</p><div class="scroll"><table><thead><tr><th>Layer</th><th class="num">mm</th><th class="num">Vol.</th><th>Durability</th><th>Environment</th><th>Well-being</th><th>Cost</th><th class="num">Mean</th></tr></thead><tbody>${P.layers.map((l,i)=>`<tr data-i="${i}" style="${i===S.layer?'background:var(--soft)':''}"><td>${l.m}</td><td class="num">${l.t||'–'}${l.fr<1?' ×'+l.fr:''}</td><td class="num">${(100*l.vs).toFixed(1)}%</td>${l.sc.map((s,j)=>`<td><div class="bar"><b style="width:${s}%;background:${CCOL[['D','E','W','C'][j]]}"></b><span>${s.toFixed(0)}</span></div></td>`).join('')}<td class="num"><strong>${L1w(l).toFixed(0)}</strong></td></tr>`).join('')}</tbody></table></div>
  <div class="detail"><strong>${L.m}</strong>: GWP A1–A3 ${L.a13} kgCO₂e/m², 50-year life cycle ${L.lg} kgCO₂e/m²; service life ${L.life} y (${L.nrep} renewals), cost incl. renewals ${L.cost} €/m². Source: OBD pool “${L.pool}”, median of ${L.n} EPDs; life, ratings and cost are assumptions.</div></div>`);
  tl.querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>{S.layer=+r.dataset.i;renderMain()});
  m.appendChild(tl);
  const IN=['Moisture','Structural','Fire & acoustics','Disassembly'];
  const ic=$(`<div class="panel"><h3>Material compatibility (criterion 5)</h3><p class="note">Each interface is rated on four checks. Click one for the issue and the fix. Interface score = mean of the checks (good 100, caution 50, critical 0).</p><div class="chips" id="ch"></div><div id="dt"></div></div>`);
  const ch=ic.querySelector('#ch');
  P.ifs.forEach((x,i)=>{const b=$(`<button class="chip ${i===S.ifx?'on':''}"><span class="pill ${x.r}">${x.r}</span> ${x.A} / ${x.B}</button>`);b.onclick=()=>{S.ifx=S.ifx===i?null:i;renderMain()};ch.appendChild(b)});
  if(!P.ifs.length)ch.innerHTML='<span class="note">Single-layer part: no interfaces.</span>';
  const dt=ic.querySelector('#dt');
  if(S.ifx!=null&&P.ifs[S.ifx]){const x=P.ifs[S.ifx];dt.innerHTML=`<div class="detail"><div class="chips" style="margin-bottom:6px">${x.c.map((c,j)=>`<span><small class="note">${IN[j]}</small> <span class="pill ${c}">${c}</span></span>`).join('')}</div>${x.note?`<div>${x.note}</div>`:''}${x.fx.length?`<div><strong>Fix:</strong> ${x.fx.join('; ')}</div>`:'<div>No fix needed.</div>'}</div>`}
  else dt.innerHTML=`<div class="detail"><strong>Whole build-up.</strong> Glaser (DIN 4108-3, steady state): ${P.glaser}.<br>Fire: ${P.fire}.<br>Sound: ${P.snd}.</div>`;
  m.appendChild(ic)}
function strip(P){return `<div class="build" style="min-height:70px">${P.layers.map(l=>`<div style="flex:${Math.max(l.vs,.015)*100} 1 0;background:${heat(L1w(l))}"><span>${l.m}<small>${l.t||''}</small></span></div>`).join('')}</div>`}
function vWalls(m){
  const wp=['OW','IL','IP'];
  const t=$(`<div class="panel"><h2>Outer wall versus inner walls</h2><p class="sub" style="margin:0 0 10px">The outer wall carries weather, insulation (U ≤ 0.20 W/m²K) and moisture control, so it has a render or plaster skin, thick insulation and a drying direction outward. Inner walls carry load and sound; both faces face rooms, so surface material matters most for indoor air. Layer width = thickness.</p><div class="sel"><label>Alternative<select id="sa">${AL.map(x=>`<option value="${x.id}" ${x.id===S.alt?'selected':''}>${x.id}. ${x.name}</option>`).join('')}</select></label></div></div>`);
  t.querySelector('#sa').onchange=e=>{S.alt=+e.target.value;renderMain()};
  const a=AL[S.alt-1];
  wp.forEach(p=>{const P=a.parts[p];t.appendChild($(`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>${PN[p]}</h3><span class="mono">score ${f1(pScore(S.alt,p))} · well-being ${P.crit.W.toFixed(0)} · compat. ${P.crit.K.toFixed(0)}</span></div>${strip(P)}</div>`))});
  m.appendChild(t);
  const c=$(`<div class="panel"><h3>Well-being score of each wall type, all alternatives</h3><div class="scroll"><table><thead><tr><th>Alternative</th>${wp.map(p=>`<th class="num">${PN[p]}</th>`).join('')}</tr></thead><tbody>${AL.map(x=>`<tr><td>${x.id}. ${x.short}</td>${wp.map(p=>`<td class="num" style="background:${heat(x.parts[p].crit.W)}">${x.parts[p].crit.W.toFixed(0)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">Room-facing layer counts 50 % of the well-being weight; the other layers share the rest by volume.</p></div>`);
  m.appendChild(c)}
function bars(title,key,unit,fmt){
  const vals=AL.map(a=>a[key]),mn=Math.min(0,...vals),mx=Math.max(...vals),W=560,H=AL.length*30+30,x0=150,sc=v=>x0+(v-mn)/(mx-mn)*(W-x0-50);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}"><text class="ch-t" x="0" y="14">${title}</text>${AL.map((a,i)=>{const y=30+i*30,v=a[key];return `<text x="0" y="${y+14}" font-size="12">${a.id}. ${a.short}</text><rect x="${Math.min(sc(0),sc(v))}" y="${y+2}" width="${Math.abs(sc(v)-sc(0))}" height="18" rx="2" fill="${ACOL(a.id)}"/><text class="mute" x="${v<0?sc(v)-4:sc(v)+4}" y="${y+15}" font-size="11" text-anchor="${v<0?'end':'start'}">${fmt(v)}</text>`}).join('')}<line x1="${sc(0)}" x2="${sc(0)}" y1="22" y2="${H}" stroke="var(--mute)" stroke-width="1"/></svg>`}
function vCarbon(m){
  const p=$(`<div class="panel"><h2>Carbon and cost per m² floor area</h2><p class="sub" style="margin:0 0 12px">Structure, envelope and windows. GWP is GWPtotal (A2) from the OBD: A1–A3 includes the biogenic uptake of timber and straw (negative); the 50-year life cycle adds renewals and end of life (C1–C4). Cost is an assumption.</p><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div>${bars('GWP A1–A3, kgCO₂e/m²','a13','',v=>v.toFixed(0))}</div><div>${bars('GWP life cycle 50 y, kgCO₂e/m²','life','',v=>v.toFixed(0))}</div><div>${bars('Cost incl. renewals 50 y, €/m² (assumed)','cost','',v=>v.toFixed(0))}</div></div></div>`);
  m.appendChild(p);
  const W=560,H=300,pad=44,xs=AL.map(a=>a.life),ys=AL.map(a=>alt(a.id).tot),xmn=Math.min(...xs)-15,xmx=Math.max(...xs)+15,ymn=Math.min(...ys)-3,ymx=Math.max(...ys)+3;
  const X=v=>pad+(v-xmn)/(xmx-xmn)*(W-pad-14),Y=v=>H-pad-(v-ymn)/(ymx-ymn)*(H-pad-14);
  const sc=$(`<div class="panel"><h3>Does low carbon cost score?</h3><p class="note">Whole-building score (your weights) against life-cycle GWP. Up and to the left is better.</p><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="score versus life cycle carbon"><line x1="${pad}" y1="${H-pad}" x2="${W-10}" y2="${H-pad}" stroke="var(--line)"/><line x1="${pad}" y1="10" x2="${pad}" y2="${H-pad}" stroke="var(--line)"/><text class="mute" x="${W/2}" y="${H-8}" font-size="11" text-anchor="middle">life-cycle GWP, kgCO₂e per m² floor area</text><text class="mute" x="12" y="${H/2}" font-size="11" transform="rotate(-90 12 ${H/2})" text-anchor="middle">score /100</text>${[0,1,2,3].map(i=>{const v=xmn+(xmx-xmn)*i/3;return `<text class="mute" x="${X(v)}" y="${H-pad+14}" font-size="10" text-anchor="middle">${v.toFixed(0)}</text>`}).join('')}${[0,1,2,3].map(i=>{const v=ymn+(ymx-ymn)*i/3;return `<text class="mute" x="${pad-6}" y="${Y(v)+3}" font-size="10" text-anchor="end">${v.toFixed(0)}</text>`}).join('')}${AL.map((a,i)=>`<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="7" fill="${ACOL(a.id)}"/><text x="${X(xs[i])+10}" y="${Y(ys[i])+4}" font-size="12">${a.id}. ${a.short}</text>`).join('')}</svg></div>`);
  m.appendChild(sc)}
function vSens(m){
  const S0=D.sens,names=Object.keys(S0.scen),base0=S0.scen[names[0]];
  const rk=s=>{const o=Object.keys(s).sort((a,b)=>s[b]-s[a]);return Object.fromEntries(o.map((x,i)=>[x,i+1]))};
  const br=rk(base0);
  const t=$(`<div class="panel"><h2>Sensitivity</h2><p class="sub" style="margin:0 0 10px">Rank (weighted score) per alternative when one assumption changes. Orange marks a rank different from the base run.</p><div class="scroll"><table><thead><tr><th>Scenario</th>${AL.map(a=>`<th class="num">${a.id}</th>`).join('')}</tr></thead><tbody>${names.map(n=>{const r=rk(S0.scen[n]);return `<tr><td>${n}</td>${AL.map(a=>`<td class="num" style="${r[a.id]!==br[a.id]?'color:var(--accent);font-weight:600':''}">${r[a.id]} <span class="note">(${S0.scen[n][a.id].toFixed(1)})</span></td>`).join('')}</tr>`}).join('')}</tbody></table></div></div>`);
  m.appendChild(t);
  const N=400,mc=$(`<div class="panel"><h3>Random draws (${N})</h3><p class="note">Cost ±20 %, service life ±20 % per material, every 1–5 rating ±1.</p><div class="mc">${AL.map(a=>{const w=100*(S0.win[a.id]||0)/N,t3=100*(S0.top3[a.id]||0)/N;return `<div class="b"><span>${a.id}. ${a.short}</span><div><i style="width:${t3}%;background:var(--soft);outline:1px solid var(--line)"></i><i style="width:${w}%;background:${ACOL(a.id)};margin-top:-12px"></i></div><span class="mono">${w.toFixed(0)}% / ${t3.toFixed(0)}%</span></div>`}).join('')}</div><p class="note">Solid bar: share of draws ranked first. Pale bar: ranked in the top three.</p></div>`);
  m.appendChild(mc)}
const ASM=[['Building geometry per m² GFA','outer wall 0.68, windows 0.17, inner load-bearing wall 0.35, partitions 0.50, floors 0.60, roof 0.40, ground slab 0.40 m²','2–3 storeys, 200 m² footprint, 20 % glazing'],
['U-value targets','outer wall 0.20, roof 0.14, ground slab 0.25 W/m²K','stricter than GEG reference values, so no early retrofit'],
['λ and μ values','e.g. rock wool 0.036 / μ 1, EPS 0.035 / 40, wood fibre 0.040 / 5, straw 0.052 / 2, RC 2.0 / 80, CLT 0.13 / 50','not in OBD; Glaser steady state, DIN 4108-3 climate'],
['Fire and sound requirements','REI/EI 30 (Gebäudeklasse 3); Rw 53 dB separating wall, 54 floor, 40 outer wall/roof, 35 partition, 32 window','DIN 4109 style; mass law or typical framed values'],
['Service lives','structure 100 y, render/ETICS 40, plasterboard 50, paint 12, membranes 30–50, windows 35','no service-life field in OBD'],
['Ratings 1–5','moisture/fire/pest, VOC, buffering, sound contribution per material','qualitative; OBD has no emission or hygric data'],
['Costs','e.g. RC 470 €/m³, CLT 850, rock wool 180, plastic window 520 €/m²','no cost data in OBD; indicative German prices'],
['Operating cost','equal for all alternatives','same GEG standard, plan and U-values'],
['Clay block, hempcrete','fired brick EPD and sand-lime brick; straw bale instead of hempcrete','no unit EPD / wall EPD in OBD'],
['Thin data','straw 2 EPDs, cellulose 2, fired brick 3, steel sections 3, roof tile 1, timber window 1, composite slab 1','medians of mixed generic/average/specific datasets']];
function vAssume(m){m.appendChild($(`<div class="panel"><h2>Assumptions and data gaps</h2><p class="sub" style="margin:0 0 10px">Everything below is missing from the data set and was set by the analyst. Facts used from OBD 2024-II: GWPtotal (A2), PERT, PENRT, SM, HWD, NHWD, density, modules A1-A3 and C1–C4.</p><div class="scroll"><table><thead><tr><th>Item</th><th>Value used</th><th>Reason</th></tr></thead><tbody>${ASM.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`))}
function renderMain(){const m=document.getElementById('view');m.innerHTML='';({overview:vOverview,parts:vParts,drill:vDrill,walls:vWalls,carbon:vCarbon,sens:vSens,assume:vAssume}[S.view]||vOverview)(m)}
function render(){const y=scrollY;nav();const c=document.getElementById('ctl');c.innerHTML='';if(!['sens','assume'].includes(S.view))c.appendChild(sliders());renderMain();scrollTo(0,y)}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==S.view){S.view=h;render()}});
render();
</script>
